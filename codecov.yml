# The published coverage is the library's and its CLI's. These directories are
# development tools, samples and test helpers (internal/testutils is imported
# only by the tests and cmd/htmlcompare), not code the library or the CLI
# runs, so they stay out of the figure. (tools/libcmp is a separate Go module
# and is never measured.)
ignore:
  - "cmd/htmlcompare/**"
  - "cmd/utils/**"
  - "examples/**"
  - "internal/testutils/**"
